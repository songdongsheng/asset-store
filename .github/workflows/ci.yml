# https://docs.github.com/en/actions/reference/workflows-and-actions

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0,2,4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    # windows-2025, windows-11-arm
    # macos-26, macos-26-xlarge
    # ubuntu-(22|24|26).04, ubuntu-(22|24|26).04-arm
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image:
          - docker.io/songdongsheng/tencentos:2
          - docker.io/songdongsheng/tencentos:3
          - docker.io/songdongsheng/tencentos:4
          - registry.access.redhat.com/ubi8
          - registry.access.redhat.com/ubi9
          - registry.access.redhat.com/ubi10
          - docker.io/songdongsheng/debian:10
          - docker.io/songdongsheng/debian:11
          - docker.io/library/debian:12
          - docker.io/library/ubuntu:20.04
          - docker.io/library/ubuntu:22.04
          - docker.io/library/ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: artifact-name
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          t="${IMAGE##*/}"
          echo "name=${{ matrix.arch }}-${t//:/-}" >> "$GITHUB_OUTPUT"
      - run: |
          mkdir build-output
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/build-output:/build-output" -w /w \
            "${{ matrix.image }}" ci/cleanup.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: build-output/artifacts
          overwrite: true
          if-no-files-found: error
          retention-days: 7
